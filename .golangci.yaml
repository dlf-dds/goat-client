# golangci-lint config for goat-client.
#
# Adapted from netbird upstream (https://github.com/netbirdio/netbird/blob/main/.golangci.yaml)
# under BSD 3-Clause license — same set of enabled linters + revive doc enforcement
# + gosec hardening; netbird-specific path exclusions stripped (our tree is simpler).
#
# Rationale (per Block 76 GAP #1, 2026-05-10 engineering-quality survey):
#   netbird ships strict lint discipline (errcheck/gosec/staticcheck/revive); we
#   forked their client/ tree but didn't carry the lint config. UI dialogs ship
#   with unchecked error returns, exported APIs lack godoc enforcement, etc.
#   This config closes that gap before goat-client-v0.1.0.
#
# CI gate: .github/workflows/ci.yml runs golangci-lint via golangci-lint-action@v6
# on every PR + push to main.
version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dupword
    - durationcheck
    - errcheck
    - forbidigo
    - gocritic
    - gosec
    - govet
    - ineffassign
    - mirror
    - misspell
    - nilerr
    - nilnil
    - predeclared
    - revive
    - sqlclosecheck
    - staticcheck
    - unused
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: false
    gocritic:
      disabled-checks:
        - commentFormatting
        - captLocal
        - deprecatedComment
    gosec:
      includes:
        - G101
        - G103
        - G104
        - G106
        - G108
        - G109
        - G110
        - G111
        - G201
        - G202
        - G203
        - G301
        - G302
        - G303
        - G304
        - G305
        - G306
        - G307
        - G403
        - G502
        - G503
        - G504
        - G601
        - G602
    govet:
      enable:
        - nilness
      enable-all: false
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
          severity: warning
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files: relax gosec + mirror (test setup often tolerates patterns
      # gosec flags as risky in production code).
      - linters:
          - gosec
          - mirror
        path: _test\.go
      # Mock files: nilnil is fine for mocks that intentionally return (nil, nil).
      - linters:
          - nilnil
        path: mock\.go
      # Inherited from netbird's grpc dialer — gRPC deprecation warnings on
      # DialContext/WithBlock are upstream churn not yet addressed.
      - linters:
          - staticcheck
        text: grpc.DialContext is deprecated
      - linters:
          - staticcheck
        text: grpc.WithBlock is deprecated
      # Quick-fix rules from staticcheck v1.0+ that fire on legitimate patterns.
      - linters:
          - staticcheck
        text: "QF1001"
      - linters:
          - staticcheck
        text: "QF1008"
      - linters:
          - staticcheck
        text: "QF1012"
    paths:
      - third_party$
      - builtin$
      - examples$
      # mobile/ subdirs are mostly Swift / Kotlin / Xcode project files; the
      # gomobile-bound Go is in client.go. Vet/lint applies to it via the
      # default ./... walk; no special exclusion needed.
issues:
  max-same-issues: 5
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
