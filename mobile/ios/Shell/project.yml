# xcodegen spec for the goat-client iOS Xcode project.
#
# Materialize the .xcodeproj with:
#   cd mobile/ios/Shell
#   xcodegen generate
#
# (Install xcodegen via `brew install xcodegen`. Apple-Silicon-only iOS
# Simulator builds: `xcodebuild -scheme GoatClient -destination 'platform=iOS
# Simulator,name=iPhone 15'`.)
#
# Generated .xcodeproj is gitignored — only this YAML + the Swift sources are
# tracked. Re-run `xcodegen generate` after any change here.

name: GoatClient
options:
  bundleIdPrefix: io.dlf-dds.goat-client
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    # Allow building without a Developer Program team (Simulator only). For
    # device builds, the operator sets DEVELOPMENT_TEAM in a local override
    # (project-overrides.yml or Xcode UI) — the Apple Developer Program is
    # gating procurement, not code.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_ALLOWED: "$(CODE_SIGNING_ALLOWED_FOR_BUILD_$(EFFECTIVE_PLATFORM_NAME:lower))"
    CODE_SIGNING_ALLOWED_FOR_BUILD_iphoneos: YES
    CODE_SIGNING_ALLOWED_FOR_BUILD_iphonesimulator: NO
    CODE_SIGNING_REQUIRED_iphonesimulator: NO

targets:
  GoatClient:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dlf-dds.goat-client
        PRODUCT_NAME: GoatClient
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/GoatClient.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PacketTunnel
        embed: true
        codeSign: true
      # GoatClientSDK.xcframework — generated by
      # `mobile/ios/scripts/build-xcframework.sh`. Path is relative to the
      # project file (mobile/ios/Shell/), so the frameworks/ subdir is
      # expected to be a sibling of project.yml after the build script runs.
      - framework: ../GoatClientSDK.xcframework
        embed: true
        optional: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dlf-dds.goat-client.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
    dependencies:
      - sdk: NetworkExtension.framework
      - framework: ../GoatClientSDK.xcframework
        embed: false
        optional: true

schemes:
  GoatClient:
    build:
      targets:
        GoatClient: all
    run:
      config: Debug
    archive:
      config: Release
