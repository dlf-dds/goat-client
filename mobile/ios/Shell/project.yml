# xcodegen spec for the goat-client iOS Xcode project.
#
# Materialize the .xcodeproj with:
#   cd mobile/ios/Shell
#   xcodegen generate
#
# (Install xcodegen via `brew install xcodegen`. Apple-Silicon-only iOS
# Simulator builds: `xcodebuild -scheme GoatClient -destination 'platform=iOS
# Simulator,name=iPhone 15'`.)
#
# Generated .xcodeproj is gitignored — only this YAML + the Swift sources are
# tracked. Re-run `xcodegen generate` after any change here.

name: GoatClient
options:
  bundleIdPrefix: io.dlf-dds.goat-client
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    # DEVELOPMENT_TEAM is pulled from the APPLE_DEVELOPMENT_TEAM env var at
    # xcodegen-time (direnv loads it from .envrc.local). Empty default keeps
    # Simulator-only builds working without an Apple Developer Program team.
    DEVELOPMENT_TEAM: "${APPLE_DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    # CODE_SIGN_IDENTITY is intentionally NOT set. With
    # CODE_SIGN_STYLE = Automatic, Xcode resolves the identity per build
    # action: Apple Development for `build`, Apple Distribution for
    # `archive`. Setting an explicit identity here triggers a "conflict
    # between automatic and manual signing" error (observed for the
    # PacketTunnel target when forcing Apple Distribution).
    #
    # The earlier
    #   CODE_SIGNING_ALLOWED = $(CODE_SIGNING_ALLOWED_FOR_BUILD_$(EFFECTIVE_PLATFORM_NAME:lower))
    # was also load-bearing wrong — EFFECTIVE_PLATFORM_NAME is
    # "-iphoneos" (with a leading dash), so the variable lookup resolved
    # to a non-existent key, yielding an empty CODE_SIGNING_ALLOWED. That
    # cascaded into the archive being produced unsigned
    # (SigningIdentity == "" in the xcarchive Info.plist) and every
    # downstream TestFlight-upload symptom (stripped entitlements,
    # framework signing failures, etc.). Both stripped — Xcode's
    # platform defaults handle the simulator-vs-device split correctly.

targets:
  GoatClient:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dlf-dds.goat-client
        PRODUCT_NAME: GoatClient
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/GoatClient.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PacketTunnel
        embed: true
        codeSign: true
      # libresolv.tbd — netbird's un-strip (76N M0+M1) pulled in
      # net/dns resolver code that references `res_9_ninit` /
      # `res_9_nclose`. On iOS device builds those live in libresolv;
      # the Simulator has them in libSystem so the dependency only
      # surfaces under -destination=generic/platform=iOS.
      - sdk: libresolv.tbd
      # GoatClientSDK.xcframework — generated by
      # `mobile/ios/scripts/build-xcframework.sh`. Path is relative to the
      # project file (mobile/ios/Shell/), so the frameworks/ subdir is
      # expected to be a sibling of project.yml after the build script runs.
      - framework: ../GoatClientSDK.xcframework
        embed: true
        optional: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dlf-dds.goat-client.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
    dependencies:
      - sdk: NetworkExtension.framework
      # libresolv.tbd — see GoatClient target note above. Same reason.
      - sdk: libresolv.tbd
      - framework: ../GoatClientSDK.xcframework
        embed: false
        optional: true

schemes:
  GoatClient:
    build:
      targets:
        GoatClient: all
    run:
      config: Debug
    archive:
      config: Release
