---
# nfpm config for the Fedora/RHEL .rpm of goat-client.
#
# Driven by `nfpm pkg --config packaging/rpm/nfpm.yaml --packager rpm --target dist/`.
#
# Layout mirrors packaging/deb/nfpm.yaml — same install paths, same
# systemd unit, same XDG .desktop. Differences are RPM-specific:
# scriptlet names, dependency syntax, conffile flag.

name: goat-client
arch: ${GOARCH}                 # amd64 → x86_64, arm64 → aarch64 (nfpm maps automatically)
platform: linux
version: ${VERSION}
section: Applications/Internet
priority: optional
maintainer: dlf-dds <ops@dlf-dds.invalid>
description: |
  goat-client — single-tunnel WireGuard client for the goat overlay.
  Consumes an offline-CA-signed CBOR enrollment bundle and brings up
  the wg-cp0 outer tunnel. Includes a system daemon (goat-clientd) and
  a Fyne desktop GUI (goat-client).
vendor: dlf-dds
homepage: https://github.com/dlf-dds/goat-client
license: BSD-3-Clause

depends:
  - glibc
  - shadow-utils                # for useradd in scriptlets
recommends:
  - wireguard-tools

contents:
  - src: ./dist/linux_${GOARCH}/goat-clientd
    dst: /usr/bin/goat-clientd
    file_info:
      mode: 0755

  - src: ./dist/linux_${GOARCH}/goat-client
    dst: /usr/bin/goat-client
    file_info:
      mode: 0755

  # systemd unit. RPM lays it under /usr/lib/systemd (/lib is a symlink
  # on modern distros but RPM convention is /usr/lib).
  - src: ./packaging/rpm/systemd/goat-clientd.service
    dst: /usr/lib/systemd/system/goat-clientd.service
    file_info:
      mode: 0644

  - src: ./packaging/rpm/goat-client.desktop
    dst: /usr/share/applications/goat-client.desktop
    file_info:
      mode: 0644

  - src: ./internal/ui/assets/goat-client.png
    dst: /usr/share/icons/hicolor/256x256/apps/goat-client.png
    file_info:
      mode: 0644

  - src: ./packaging/rpm/sysconfig/goat-client
    dst: /etc/sysconfig/goat-client
    type: config|noreplace
    file_info:
      mode: 0644

scripts:
  preinstall: ./packaging/rpm/scripts/preinstall.sh
  postinstall: ./packaging/rpm/scripts/postinstall.sh
  preremove: ./packaging/rpm/scripts/preremove.sh
  postremove: ./packaging/rpm/scripts/postremove.sh

rpm:
  group: Applications/Internet
  summary: WireGuard client for the goat overlay
  # GPG signing key supplied at build time via env (per the netbird
  # pattern). Engineering builds ship unsigned; signed builds require
  # the operator-fired procurement to provision GPG_RPM_KEY_FILE in CI.
  signature:
    key_file: ${GPG_RPM_KEY_FILE}
