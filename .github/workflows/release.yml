name: release

# HANDOFF.md Track E — five-platform CI matrix + cosign-signed releases.
# Mirrors goat-trunk's snitch.yml (Block 61H pattern):
#   - six desktop targets: linux/{amd64,arm64} darwin/{amd64,arm64} windows/{amd64,arm64}
#   - reproducible build flags: -trimpath -buildvcs=false -ldflags="-s -w"
#   - per-archive .sha256 sidecar; aggregate SHA256SUMS manifest
#   - cosign keyless signing via sigstore + GitHub Actions OIDC on tag
#     push (refs/tags/goat-client-v*); per-archive .cosign-bundle sidecar
#   - GitHub Release with all assets on tag push
#
# ## Two-matrix structure (Phase 2)
#
# `build-daemon-matrix` cross-compiles `cmd/goat-clientd` from a single
# ubuntu-latest with `CGO_ENABLED=0`. Six fan-out rows; each finishes in
# under a minute. Runs on every PR + push + tag + schedule for fast
# regression catch. Daemon-only artifacts (`goat-clientd-*`) ship to the
# Actions artifact store for debugging but are NOT consumed by the
# release path — they're a sanity net.
#
# `build-gui-matrix` builds BOTH `cmd/goat-clientd` AND `cmd/goat-client`
# (the Fyne GUI) on per-OS native runners with `CGO_ENABLED=1`, then
# executes `go test -race -count=1 ./...` natively on the same runner
# (skipped on darwin/amd64 — cross-compiled from M1, no native x86_64
# host). Six fan-out rows, each on its own runner image:
#   - linux/amd64    → ubuntu-latest      (apt: Fyne X11/Wayland deps)
#   - linux/arm64    → ubuntu-24.04-arm   (apt: same)
#   - darwin/amd64   → macos-latest       (cross from M1 to x86_64
#                                          via `clang -arch x86_64`;
#                                          macos-13 hosted runners
#                                          have ~hour-long queue
#                                          waits and are deprecated)
#   - darwin/arm64   → macos-latest       (Apple Silicon, native)
#   - windows/amd64  → windows-latest     (MinGW preinstalled)
#   - windows/arm64  → windows-11-arm     (clang via MSVC build tools)
# This matrix gates BOTH the PR-merge path (build + native test on each
# target) and the tag-push release path (the resulting archives feed
# checksums → cosign → release). The `goat-client-*` archives ship with
# both binaries side by side under `dist/<goos>_<goarch>/`, which is the
# layout `packaging/` expects.
#
# Why two matrices: Fyne v2.7's go-gl/glfw imports need CGO + a per-OS
# native windowing toolchain (X11/Mesa on Linux, Cocoa/AppKit on macOS,
# Win32/MinGW on Windows). A Linux cross-compile runner can't satisfy
# any of those. Native runners give us a real toolchain at the cost of
# slower wall-clock; the daemon-only Linux cross-compile keeps PR
# feedback under a minute.
#
# Block 76 GAP #3 (2026-05-10 engineering-quality survey vs upstream
# netbird) called out that `go test` only ran on Linux on PRs, leaving
# macOS + Windows regressions to surface at tag-time. The GUI matrix
# now runs the full test suite natively on every PR, gating merge on
# any of five exec-capable targets failing (darwin/amd64 stays
# build-only — Rosetta on M1 isn't guaranteed on hosted runners and
# the cross-compile build alone is the contract for that target).
#
# Operators verify any archive with:
#
#   cosign verify-blob \
#     --bundle goat-client-linux-amd64.tar.gz.cosign-bundle \
#     --certificate-identity-regexp '^https://github.com/dlf-dds/goat-client/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     goat-client-linux-amd64.tar.gz
#
# Triggers:
#   - PR: daemon-matrix + GUI-matrix (with `go test`) gate the merge.
#     `checksums`, `package-*-smoke`, `cosign`, `release` stay opted-out
#     to keep PR-time fast and to avoid burning Sigstore log entries on
#     non-shipping refs.
#   - push to main / tag / schedule / workflow_dispatch: all jobs run.
#   - tag push goat-client-v*: cosign + GitHub Release wired in.

on:
  push:
    branches: [main]
    tags:
      - 'goat-client-v*'
  pull_request:
  schedule:
    # Saturday 03:23 UTC — same window as goat-trunk's snitch cron, off
    # the hour to avoid GitHub Actions cron stampedes.
    - cron: '23 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-daemon-matrix:
    name: daemon ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.target.goos }}
      GOARCH: ${{ matrix.target.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Resolve commit timestamp for reproducibility
        id: ts
        run: |
          set -euo pipefail
          ts=$(git log -1 --format=%ct HEAD)
          echo "epoch=${ts}" >> "$GITHUB_OUTPUT"
      - name: go vet (per-target view of build tags)
        # Vet only the daemon-side packages: cmd/goat-client + internal/ui
        # pull in go-gl/glfw which needs a CGO + native-windowing toolchain
        # the cross-compile runner doesn't have. Native GUI vet runs in
        # ci.yml and in the build-gui-matrix below.
        run: go vet ./cmd/goat-clientd ./internal/bundle/... ./internal/ipc/... ./internal/tunnel/... ./internal/daemon/... ./internal/reachability/...
      - name: Cross-compile daemon binary
        id: build
        env:
          SOURCE_DATE_EPOCH: ${{ steps.ts.outputs.epoch }}
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p stage
          go build -trimpath -buildvcs=false -ldflags="-s -w" \
            -o "stage/goat-clientd${ext}" ./cmd/goat-clientd
          echo "ext=${ext}" >> "$GITHUB_OUTPUT"
      - name: Verify per-target test compile
        # `go test -c` compiles a test binary without running it.
        # `go test -count=0` would actually exec the cross-compiled
        # binary on this Linux runner — windows.exe / darwin Mach-O
        # both crash with "exec format error" — so -c is mandatory
        # here. Discarding the artifact via -o /dev/null.
        run: |
          set -euo pipefail
          for pkg in ./internal/bundle ./internal/ipc ./internal/tunnel; do
            go test -c -o /dev/null "$pkg"
          done
      - name: Upload daemon-only artifact (sanity, not consumed by release)
        uses: actions/upload-artifact@v4
        with:
          # Distinct name from `goat-client-*` so the release path's
          # download-artifact + flatten step doesn't pick these up.
          name: goat-clientd-only-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: stage/goat-clientd${{ steps.build.outputs.ext }}
          if-no-files-found: error
          retention-days: 14

  build-gui-matrix:
    name: gui ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    # Gates PR merges (Block 76 GAP #3). Six native-runner builds are
    # slower than a single Linux build, but the only way to actually
    # block merges on a macOS or Windows regression is to compile +
    # test on those OSes. The `fast` job in ci.yml still runs in
    # parallel for quick Linux feedback while this matrix completes.
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux,   goarch: amd64, runner: ubuntu-latest    }
          - { goos: linux,   goarch: arm64, runner: ubuntu-24.04-arm }
          # darwin/amd64 cross-compiles from macos-latest (Apple
          # Silicon) via `clang -arch x86_64`. macos-13 (Intel) hosted
          # runners are scarce — observed 60+ minute queue waits on
          # weekends, with no SLA — and Apple deprecated x86_64 macOS
          # SDKs as a build target in 2025. Cross from M1 with the
          # Xcode SDK's universal headers is fast (~1 min) and
          # produces a valid x86_64 Mach-O binary; locally validated
          # on darwin/arm64 host before this change landed.
          - { goos: darwin,  goarch: amd64, runner: macos-latest     }
          - { goos: darwin,  goarch: arm64, runner: macos-latest     }
          - { goos: windows, goarch: amd64, runner: windows-latest   }
          - { goos: windows, goarch: arm64, runner: windows-11-arm   }
    env:
      CGO_ENABLED: "1"
      GOOS: ${{ matrix.target.goos }}
      GOARCH: ${{ matrix.target.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Fyne build dependencies (Linux)
        if: runner.os == 'Linux'
        # Fyne v2.7 needs CGO + Mesa GL + X11 + Wayland + xkbcommon dev
        # headers. Standard list from https://docs.fyne.io/started/.
        # Same set works on amd64 (ubuntu-latest) and arm64
        # (ubuntu-24.04-arm).
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev \
            libxxf86vm-dev pkg-config

      - name: Install llvm-mingw (windows/arm64 only)
        if: matrix.target.runner == 'windows-11-arm'
        shell: pwsh
        # windows-11-arm ships MSVC build tools + clang in the MSVC ABI,
        # but Go's cgo on windows/arm64 expects a MinGW-style toolchain.
        # llvm-mingw is the canonical cross/host MinGW toolchain that
        # supports aarch64 hosts; we pin a release and prepend its
        # bin/ to PATH so go's cgo picks up `clang` (mingw target).
        # windows-latest amd64 already has MinGW preinstalled, so this
        # step is arm64-only.
        #
        # llvm-mingw publishes msvcrt-* zips only for x86_64 / i686 /
        # armv7. The aarch64 host build is shipped exclusively as
        # ucrt-aarch64.zip — UCRT is the right choice on Windows 10+
        # anyway (and required for arm64 Windows). Pinned version
        # 20260421 (LLVM 22.1.4) — bump as upstream cuts releases.
        run: |
          $version = '20260421'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/${version}/llvm-mingw-${version}-ucrt-aarch64.zip"
          Write-Host "Downloading llvm-mingw ${version} aarch64 from $url"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\ -Force
          $dir = (Get-ChildItem C:\ -Directory -Filter 'llvm-mingw-*' | Select-Object -First 1).FullName
          $bin = Join-Path $dir 'bin'
          Write-Host "Adding $bin to PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Add-Content -Path $env:GITHUB_ENV  -Value "CC=clang"
          Add-Content -Path $env:GITHUB_ENV  -Value "CXX=clang++"
      - name: Configure darwin/amd64 cross from M1 host
        if: matrix.target.goos == 'darwin' && matrix.target.goarch == 'amd64'
        shell: bash
        # macos-latest is Apple Silicon. Cross-compile to x86_64 by
        # passing `-arch x86_64` to clang; cgo picks up the toolchain
        # via CC/CXX. The Xcode SDK ships both arm64 and x86_64
        # libraries — no extra SDK install needed.
        run: |
          set -euo pipefail
          {
            echo "CC=clang -arch x86_64"
            echo "CXX=clang++ -arch x86_64"
          } >> "$GITHUB_ENV"
      - name: Probe Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        # Log the resolved C compiler for diagnostic context in case
        # the GUI build fails downstream. windows-latest amd64 picks
        # up MinGW's gcc; windows-11-arm picks up llvm-mingw's clang
        # from the install step above.
        run: |
          set -euo pipefail
          echo "## Windows CC probe (${GOARCH})"
          echo "CC env: ${CC:-<unset>}"
          for cc in gcc clang cc "${CC:-}"; do
            [ -z "$cc" ] && continue
            if command -v "$cc" >/dev/null 2>&1; then
              echo "found: $cc -> $(command -v "$cc")"
              "$cc" --version | head -1 || true
            fi
          done

      - name: Resolve commit timestamp for reproducibility
        id: ts
        shell: bash
        run: |
          set -euo pipefail
          ts=$(git log -1 --format=%ct HEAD)
          echo "epoch=${ts}" >> "$GITHUB_OUTPUT"

      - name: Build daemon + GUI (native, CGO=1)
        id: build
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.ts.outputs.epoch }}
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"

          # Track F packaging expects dist/<goos>_<goarch>/ to carry both
          # binaries. We build into that layout and then archive the dir.
          dist_dir="dist/${GOOS}_${GOARCH}"
          mkdir -p "$dist_dir"

          # Daemon — compiled with CGO=1 here (the cross-compile job is
          # CGO=0 for portability; the native job stays CGO=1 to share
          # the toolchain with the GUI build below). Both link cleanly.
          go build -trimpath -buildvcs=false -ldflags="-s -w" \
            -o "${dist_dir}/goat-clientd${ext}" ./cmd/goat-clientd

          # GUI — Fyne, requires CGO=1.
          go build -trimpath -buildvcs=false -ldflags="-s -w" \
            -o "${dist_dir}/goat-client${ext}" ./cmd/goat-client

          ls -la "$dist_dir"
          echo "ext=${ext}" >> "$GITHUB_OUTPUT"
          echo "dist_dir=${dist_dir}" >> "$GITHUB_OUTPUT"

      - name: go test (native, CGO=1)
        # Block 76 GAP #3: execute the full test suite on every PR for
        # each natively-executable target. Skipped on darwin/amd64 —
        # the build step above cross-compiles x86_64 Mach-O from an
        # Apple Silicon host, and hosted macos-latest runners don't
        # carry Rosetta 2 by default. The cross-compile build alone
        # is the contract for that target; the 5 remaining targets
        # exercise actual test execution.
        #
        # `-race` is supported by the Go toolchain on
        # {linux,darwin,windows}/amd64, linux/arm64, and darwin/arm64,
        # but NOT on windows/arm64 — that target falls back to a
        # race-free run. The race detector's primary value here is
        # the F-108 thread-safety class (Fyne widget mutations from
        # worker goroutines), all of which is also exercised on
        # darwin/arm64 + linux/{amd64,arm64} + windows/amd64.
        if: matrix.target.goos != 'darwin' || matrix.target.goarch != 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          race_flag="-race"
          if [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ]; then
            race_flag=""
          fi
          go test $race_flag -count=1 ./...

      - name: Pack platform archive (both binaries)
        id: pack
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.ts.outputs.epoch }}
        run: |
          set -euo pipefail
          ext="${{ steps.build.outputs.ext }}"
          dist_dir="${{ steps.build.outputs.dist_dir }}"
          name="goat-client-${GOOS}-${GOARCH}"

          if [ "$GOOS" = "windows" ]; then
            archive="${name}.zip"
            # `zip` is not on Git Bash PATH on the windows-latest /
            # windows-11-arm runners; `7z` is preinstalled and adds an
            # `a -tzip` mode that produces a standard zip archive.
            # -mx=9 → max compression. -bd → no progress to stdout.
            # cd into dist_dir so the archive layout is flat (both
            # .exe at top level), matching the .tar.gz layout.
            (cd "$dist_dir" && 7z a -tzip -mx=9 -bd "../../${archive}" \
              "goat-clientd${ext}" "goat-client${ext}" >/dev/null)
          else
            archive="${name}.tar.gz"
            # GNU tar reproducibility flags: lock owner/group/mtime,
            # numeric ids, sorted entries. gzip -n strips the original
            # filename + mtime from the gzip header.
            #
            # macOS ships BSD tar by default; gtar from setup-go's
            # path or homebrew is the GNU variant. macOS runners have
            # gtar preinstalled at /usr/local/bin or via homebrew. Fall
            # back to BSD tar if gtar isn't available — the resulting
            # archive isn't byte-reproducible across runners but the
            # .sha256 on the same runner stays stable.
            tar_bin=tar
            if command -v gtar >/dev/null 2>&1; then
              tar_bin=gtar
            fi
            if "$tar_bin" --version | head -1 | grep -qi 'gnu tar'; then
              "$tar_bin" --sort=name \
                  --mtime="@${SOURCE_DATE_EPOCH}" \
                  --owner=0 --group=0 --numeric-owner \
                  -cf - -C "$dist_dir" "goat-clientd${ext}" "goat-client${ext}" \
                | gzip -9n > "${archive}"
            else
              # BSD tar fallback (macos-13). Same content, slightly
              # different metadata; sha256 still verifies on download.
              tar -cf - -C "$dist_dir" "goat-clientd${ext}" "goat-client${ext}" \
                | gzip -9n > "${archive}"
            fi
          fi

          # sha256sum is GNU coreutils on Linux; macOS uses `shasum -a 256`.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          {
            echo "### goat-client ${GOOS}/${GOARCH} (native, CGO=1)"
            echo
            echo "- Archive: \`${archive}\`"
            echo "- SHA-256: \`$(awk '{print $1}' "${archive}.sha256")\`"
            echo "- Contents: \`goat-clientd${ext}\` + \`goat-client${ext}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 90

  checksums:
    name: aggregate SHA256SUMS
    needs: build-gui-matrix
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download GUI-matrix artifacts
        uses: actions/download-artifact@v4
        with:
          # Match the gui-matrix archive names; daemon-only artifacts
          # are filtered out by this pattern.
          pattern: goat-client-*
          path: artifacts
      - name: Build SHA256SUMS manifest
        run: |
          set -euo pipefail
          (
            cd artifacts
            find . -name '*.sha256' -print0 \
              | xargs -0 cat \
              | sort -k 2 \
              > ../SHA256SUMS
          )
          {
            echo "### goat-client SHA256SUMS"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: goat-client-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  package-deb-smoke:
    name: package smoke (.deb, linux/amd64)
    # Track F's packaging expects dist/<goos>_<goarch>/ to contain BOTH
    # binaries; this job exercises that contract by unpacking the
    # gui-matrix linux/amd64 archive into the layout, running nfpm, and
    # linting the resulting .deb. Confirms the GUI binary is now picked
    # up by the package — was previously a `ghost` placeholder because
    # daemon-only archives didn't carry it.
    needs: build-gui-matrix
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download linux/amd64 archive
        uses: actions/download-artifact@v4
        with:
          name: goat-client-linux-amd64
          path: stage
      - name: Stage binaries into dist/linux_amd64/
        run: |
          set -euo pipefail
          mkdir -p dist/linux_amd64
          tar -xzf stage/goat-client-linux-amd64.tar.gz -C dist/linux_amd64
          ls -la dist/linux_amd64
          test -x dist/linux_amd64/goat-client
          test -x dist/linux_amd64/goat-clientd
      - name: Install nfpm + lintian
        run: |
          set -euo pipefail
          # nfpm v2 from the goreleaser apt repo. Pinned to v2.46 (last
          # smoke-validated version per packaging/README.md).
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.46.0/nfpm_2.46.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lintian
      - name: Build .deb
        env:
          VERSION: 0.0.1
          GOARCH: amd64
        run: |
          set -euo pipefail
          packaging/build-linux-pkg.sh deb
          ls -la dist/*.deb
      - name: Inspect .deb contents
        # Confirms BOTH binaries are present in the .deb. Catches a
        # regression where the GUI source path is renamed or the nfpm
        # contents stanza loses an entry.
        run: |
          set -euo pipefail
          deb=$(find dist -maxdepth 1 -name 'goat-client_*_amd64.deb' -print -quit)
          dpkg-deb -c "$deb" | tee /tmp/deb-contents.txt
          grep -E '\./usr/bin/goat-client$'  /tmp/deb-contents.txt
          grep -E '\./usr/bin/goat-clientd$' /tmp/deb-contents.txt
      - name: Run lintian (informational)
        # lintian flags packaging policy issues. Not gating yet — the
        # nfpm-generated .deb has a few standard tag classes we accept
        # (no maintainer changelog, no copyright, etc.) since this
        # is an engineering build, not a Debian-distro upload. Failure
        # mode is logged for visibility, not enforced.
        continue-on-error: true
        run: |
          set -euo pipefail
          deb=$(find dist -maxdepth 1 -name 'goat-client_*_amd64.deb' -print -quit)
          lintian --no-tag-display-limit "$deb" || true
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: goat-client-deb-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 90

  package-deb-headless-smoke:
    name: package smoke (.deb headless three-mode, linux/amd64)
    # Block 76P verdict gate: build the goat-client-headless .deb, install
    # it in a fresh ubuntu container, exercise three-mode install +
    # systemctl-status across all three modes. Cross-tested on ubuntu-22.04
    # to match the verdict gate's "fresh Ubuntu 22.04" target. ARM64 leg
    # of the verdict gate is operator-fired against an Orin (see
    # docs/operations/goat-client-headless-bringup.md).
    needs: build-daemon-matrix
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build daemon (-tags headless)
        run: |
          set -euo pipefail
          mkdir -p dist/linux_amd64-headless
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags headless -trimpath -buildvcs=false \
            -ldflags='-s -w' \
            -o dist/linux_amd64-headless/goat-clientd ./cmd/goat-clientd
          file dist/linux_amd64-headless/goat-clientd
      - name: Install nfpm
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.46.0/nfpm_2.46.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build goat-client-headless.deb
        env:
          VERSION: 0.0.1
          GOARCH: amd64
        run: |
          set -euo pipefail
          packaging/build-linux-pkg.sh deb-headless
          deb=$(find dist -maxdepth 1 -name 'goat-client-headless_*_amd64.deb' -print -quit)
          test -n "$deb"
          echo "deb=$deb" >> "$GITHUB_ENV"
      - name: Verify headless .deb contents
        run: |
          set -euo pipefail
          dpkg-deb -c "$deb" | tee /tmp/deb-headless-contents.txt
          # Daemon must be present.
          grep -E '\./usr/bin/goat-clientd$' /tmp/deb-headless-contents.txt
          # GUI binary must NOT be present.
          if grep -E '\./usr/bin/goat-client$' /tmp/deb-headless-contents.txt; then
            echo "headless package leaked the goat-client GUI binary" >&2
            exit 1
          fi
          # Headless systemd unit must be present.
          grep -E 'goat-clientd-headless.service' /tmp/deb-headless-contents.txt
      - name: Three-mode install + systemctl check (ubuntu-22.04, mode=combined)
        run: |
          set -euo pipefail
          sudo GOAT_MODE=combined apt install -y "$deb"
          # Daemon will fail-fast on missing trust roots; that's
          # expected — the verdict gate is "install + unit reaches
          # systemctl status without fatal config error", not
          # "bundle imported and tunnel up" which requires CA + bundle
          # we don't ship in CI. Verify the unit landed + the config
          # file carries the mode the operator chose.
          systemctl status goat-clientd-headless.service --no-pager || true
          cat /etc/goat-client/config.toml
          grep 'mode = "combined"' /etc/goat-client/config.toml
      - name: Mode-switch via runtime IPC (or sysconfig edit + restart)
        run: |
          set -euo pipefail
          # IPC socket requires the daemon to have started — but the
          # missing-trust-roots failure path means the unit may not
          # have the socket up. Use the sysconfig edit + restart
          # fallback. The end-state assertion is the same: the persisted
          # mode is the new one.
          sudo sed -i 's/^mode = .*/mode = "wg-cp0-only"/' /etc/goat-client/config.toml
          grep 'mode = "wg-cp0-only"' /etc/goat-client/config.toml
          sudo systemctl restart goat-clientd-headless.service || true
      - name: Reinstall in netbird-only mode
        run: |
          set -euo pipefail
          sudo apt-get remove -y goat-client-headless
          sudo GOAT_MODE=netbird-only apt install -y "$deb"
          grep 'mode = "netbird-only"' /etc/goat-client/config.toml
      - name: Upload headless .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: goat-client-headless-deb-amd64
          path: dist/goat-client-headless_*.deb
          if-no-files-found: error
          retention-days: 90

  cosign:
    name: cosign sign archives
    # Tag-only: signing on every push wastes Sigstore log entries and
    # leaks confusing PR-time bundles. We sign exactly what we ship.
    needs: [build-gui-matrix, checksums]
    if: startsWith(github.ref, 'refs/tags/goat-client-v')
    runs-on: ubuntu-latest
    permissions:
      # id-token: write is what makes keyless OIDC work — cosign exchanges
      # it for a Fulcio short-lived cert tied to this workflow's identity.
      contents: read
      id-token: write
    steps:
      - name: Download GUI-matrix archives + checksums
        # The pattern matches goat-client-{linux,darwin,windows}-{amd64,arm64}
        # archives AND goat-client-checksums (SHA256SUMS) in one call. It
        # also matches goat-client-deb-amd64 if package-deb-smoke happens
        # to finish before cosign starts; the staging step filters that
        # plus the checksum dir out of the asset set we sign.
        uses: actions/download-artifact@v4
        with:
          pattern: goat-client-*
          path: artifacts
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Flatten platform-named artifact dirs into a single tree.
          for d in artifacts/goat-client-*; do
            [ -d "$d" ] || continue
            base=$(basename "$d")
            # checksums + deb are not part of the cosign-signed asset set.
            [ "$base" = "goat-client-checksums" ] && continue
            [ "$base" = "goat-client-deb-amd64" ] && continue
            cp "$d"/* release-assets/
          done
          cp artifacts/goat-client-checksums/SHA256SUMS release-assets/SHA256SUMS
          ls -la release-assets/
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'
      - name: Sign archives + SHA256SUMS (keyless, sigstore OIDC)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cd release-assets
          for f in goat-client-*.tar.gz goat-client-*.zip SHA256SUMS; do
            [ -f "$f" ] || continue
            echo "signing ${f}"
            cosign sign-blob --yes \
              --bundle "${f}.cosign-bundle" \
              "${f}"
          done
          ls -la
          {
            echo "### cosign keyless signatures"
            echo
            echo "Verify with:"
            echo
            echo '```bash'
            echo "cosign verify-blob \\"
            echo "  --bundle <archive>.cosign-bundle \\"
            echo "  --certificate-identity-regexp '^https://github.com/dlf-dds/goat-client/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  <archive>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed assets bundle
        uses: actions/upload-artifact@v4
        with:
          name: goat-client-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: attach assets to GitHub Release
    needs: [cosign]
    if: startsWith(github.ref, 'refs/tags/goat-client-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed assets
        uses: actions/download-artifact@v4
        with:
          name: goat-client-release-assets
          path: release-assets
      - name: List final assets
        run: ls -la release-assets/
      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          # Auto-mark rc / alpha / beta / pre tags as pre-release so the
          # GitHub Releases UI does not promote them to "Latest". A
          # `goat-client-v0.2.0` tag still ships as a full release;
          # `goat-client-v0.2.0-rc1` / `-alpha.2` / `-beta` / `-pre.1`
          # all flip to pre-release. The condition is plain string-
          # contains on the tag ref because semver pre-release segments
          # always carry a dash before the identifier.
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-pre') }}
          body: |
            ## goat-client ${{ github.ref_name }}

            Six desktop targets, each shipped as a `.tar.gz` (Linux / macOS) or
            `.zip` (Windows) carrying both the `goat-clientd` system daemon
            and the `goat-client` Fyne desktop GUI. Built natively on each
            platform's GitHub-hosted runner with `CGO_ENABLED=1`.

            ### Verifying

            All archives + `SHA256SUMS` are signed with cosign keyless
            (sigstore + GitHub Actions OIDC). Verify any archive with:

            ```bash
            cosign verify-blob \
              --bundle <archive>.cosign-bundle \
              --certificate-identity-regexp '^https://github.com/dlf-dds/goat-client/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              <archive>
            ```

            And the manifest:

            ```bash
            sha256sum -c SHA256SUMS
            ```
